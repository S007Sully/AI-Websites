<!-- RT: Assessment form. Anchor id="assessment" is the target of every CTA. -->
<section class="rt rt-form" id="assessment" aria-labelledby="rt-form-title">
  <div class="rt-wrap rt-form__grid">
    <div class="rt-form__copy">
      <p class="rt-eyebrow">Get started</p>
      <h2 class="rt-h2" id="rt-form-title">{{form_heading}}</h2>
      <p class="rt-section-head__lead">{{form_intro}}</p>
      <ul class="rt-form__points">
        <li>{{check_icon}}<span>Takes about a minute</span></li>
        <li>{{check_icon}}<span>We reply to confirm a time that works for you</span></li>
        <li>{{check_icon}}<span>Prefer to talk? Call <a class="rt-link" href="tel:{{phone_tel}}">{{phone_display}}</a></span></li>
      </ul>
    </div>
    <div class="rt-form__card">
{{form_block}}
    </div>
  </div>
</section>
