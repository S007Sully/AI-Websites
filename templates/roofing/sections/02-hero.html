<!-- RT: Hero -->
<section class="rt rt-hero" id="rt-hero" aria-labelledby="rt-hero-title">
  <div class="rt-wrap rt-hero__grid">
    <div class="rt-hero__copy">
      <p class="rt-eyebrow rt-reveal">Roofing in {{city}}</p>
      <h1 class="rt-hero__title rt-reveal" id="rt-hero-title">A roof you don&rsquo;t have to think about.</h1>
      <p class="rt-hero__lead rt-reveal">{{business_name}} repairs and replaces roofs for homeowners across {{service_area}}. Book a roof assessment and get straight answers on what your roof needs.</p>
      <div class="rt-hero__actions rt-reveal">
        <a class="rt-btn rt-btn--primary rt-btn--lg" href="{{cta_href}}">{{cta_label}}</a>
        <a class="rt-btn rt-btn--ghost rt-btn--lg" href="tel:{{phone_tel}}">Call {{phone_display}}</a>
      </div>
      <ul class="rt-trust rt-reveal" aria-label="What to expect">
{{trust_list}}
      </ul>
    </div>
    <div class="rt-hero__visual rt-reveal" aria-hidden="false">
{{hero_visual}}
    </div>
  </div>
</section>
