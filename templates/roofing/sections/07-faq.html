<!-- RT: FAQ (native <details>, no JS needed) -->
<section class="rt rt-faq" id="rt-faq" aria-labelledby="rt-faq-title">
  <div class="rt-wrap rt-faq__inner">
    <div class="rt-section-head">
      <p class="rt-eyebrow">FAQ</p>
      <h2 class="rt-h2" id="rt-faq-title">Questions homeowners ask.</h2>
      <p class="rt-section-head__lead">Don&rsquo;t see yours? Call <a class="rt-link" href="tel:{{phone_tel}}">{{phone_display}}</a>.</p>
    </div>
    <div class="rt-faq__list">
{{faq_list}}
    </div>
  </div>
{{faq_jsonld}}
</section>
