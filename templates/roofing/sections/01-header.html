<!-- RT: Header + navigation -->
<header class="rt rt-header" id="rt-header">
  <a class="rt-skip" href="#rt-hero">Skip to content</a>
  <div class="rt-wrap rt-header__inner">
    <a class="rt-brand" href="#rt-hero" aria-label="{{business_name}} home">
      <svg class="rt-brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M3 17 16 5l13 12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 16v10h16V16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/></svg>
      <span class="rt-brand__name">{{business_name}}</span>
    </a>
    <button class="rt-menu-btn" type="button" aria-expanded="false" aria-controls="rt-nav" data-rt-menu>
      <span class="rt-menu-btn__label">Menu</span>
      <span class="rt-menu-btn__bars" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <nav class="rt-nav" id="rt-nav" aria-label="Primary">
      <ul class="rt-nav__list">
        <li><a href="#rt-services">Services</a></li>
        <li><a href="#rt-why">Why Us</a></li>
{{#if reviews}}
        <li><a href="#rt-reviews">Reviews</a></li>
{{/if}}
        <li><a href="#rt-faq">FAQ</a></li>
      </ul>
      <a class="rt-nav__phone" href="tel:{{phone_tel}}">{{phone_display}}</a>
      <a class="rt-btn rt-btn--primary rt-nav__cta" href="{{cta_href}}">{{cta_label}}</a>
    </nav>
  </div>
</header>
