<!-- RT: FAQ (native <details>, no JS needed) -->
<section class="hv hv-faq" id="hv-faq" aria-labelledby="hv-faq-title">
  <div class="hv-wrap hv-faq__inner">
    <div class="hv-section-head">
      <p class="hv-eyebrow">FAQ</p>
      <h2 class="hv-h2" id="hv-faq-title">Questions homeowners ask.</h2>
      <p class="hv-section-head__lead">Don&rsquo;t see yours? Call <a class="hv-link" href="tel:{{phone_tel}}">{{phone_display}}</a>.</p>
    </div>
    <div class="hv-faq__list">
{{faq_list}}
    </div>
  </div>
{{faq_jsonld}}
</section>
