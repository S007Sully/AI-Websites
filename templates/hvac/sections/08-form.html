<!-- RT: Assessment form. Anchor id="assessment" is the target of every CTA. -->
<section class="hv hv-form" id="assessment" aria-labelledby="hv-form-title">
  <div class="hv-wrap hv-form__grid">
    <div class="hv-form__copy">
      <p class="hv-eyebrow">Get started</p>
      <h2 class="hv-h2" id="hv-form-title">{{form_heading}}</h2>
      <p class="hv-section-head__lead">{{form_intro}}</p>
      <ul class="hv-form__points">
        <li>{{check_icon}}<span>Takes about a minute</span></li>
        <li>{{check_icon}}<span>We reply to confirm a time that works for you</span></li>
        <li>{{check_icon}}<span>Prefer to talk? Call <a class="hv-link" href="tel:{{phone_tel}}">{{phone_display}}</a></span></li>
      </ul>
    </div>
    <div class="hv-form__card">
{{form_block}}
    </div>
  </div>
</section>
