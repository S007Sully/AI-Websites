<!-- RT: Header + navigation -->
<header class="hv hv-header" id="hv-header">
  <a class="hv-skip" href="#hv-hero">Skip to content</a>
  <div class="hv-wrap hv-header__inner">
    <a class="hv-brand" href="#hv-hero" aria-label="{{business_name}} home">
      <svg class="hv-brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M16 4v24M5.6 10l20.8 12M5.6 22l20.8-12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="16" cy="16" r="3.2" fill="currentColor"/></svg>
      <span class="hv-brand__name">{{business_name}}</span>
    </a>
    <button class="hv-menu-btn" type="button" aria-expanded="false" aria-controls="hv-nav" data-hv-menu>
      <span class="hv-menu-btn__label">Menu</span>
      <span class="hv-menu-btn__bars" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <nav class="hv-nav" id="hv-nav" aria-label="Primary">
      <ul class="hv-nav__list">
        <li><a href="#hv-services">Services</a></li>
        <li><a href="#hv-why">Why Us</a></li>
{{#if reviews}}
        <li><a href="#hv-reviews">Reviews</a></li>
{{/if}}
        <li><a href="#hv-faq">FAQ</a></li>
      </ul>
      <a class="hv-nav__phone" href="tel:{{phone_tel}}">{{phone_display}}</a>
      <a class="hv-btn hv-btn--primary hv-nav__cta" href="{{cta_href}}">{{cta_label}}</a>
    </nav>
  </div>
</header>
