<!-- RT: Assessment form. Anchor id="assessment" is the target of every CTA. -->
<section class="pl pl-form" id="assessment" aria-labelledby="pl-form-title">
  <div class="pl-wrap pl-form__grid">
    <div class="pl-form__copy">
      <p class="pl-eyebrow">Get started</p>
      <h2 class="pl-h2" id="pl-form-title">{{form_heading}}</h2>
      <p class="pl-section-head__lead">{{form_intro}}</p>
      <ul class="pl-form__points">
        <li>{{check_icon}}<span>Takes about a minute</span></li>
        <li>{{check_icon}}<span>We reply to confirm a time that works for you</span></li>
        <li>{{check_icon}}<span>Prefer to talk? Call <a class="pl-link" href="tel:{{phone_tel}}">{{phone_display}}</a></span></li>
      </ul>
    </div>
    <div class="pl-form__card">
{{form_block}}
    </div>
  </div>
</section>
